name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  # Gating build. Java 17 is the bytecode baseline and Flink's recommended runtime.
  # The suite needs neither Docker nor private artifacts, so it runs in seconds.
  validate:
    uses: mekomsolutions/shared-github-workflow/.github/workflows/maven-build-test.yml@main
    with:
      java-version: 17
    secrets:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

  # Non-gating early warning for newer JVMs. Flink supports 21 only experimentally and does not
  # support 25 at all, so these are expected to be less stable than `validate`. Keep these checks
  # non-required in branch protection.
  forward-compat:
    strategy:
      fail-fast: false
      matrix:
        java-version: [21, 25]
    uses: mekomsolutions/shared-github-workflow/.github/workflows/maven-build-test.yml@main
    with:
      java-version: ${{ matrix.java-version }}
    secrets:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

  spotless:
    needs: validate
    uses: mekomsolutions/shared-github-workflow/.github/workflows/maven-spotless-check.yml@main
    with:
      java-version: 17
      maven-args: -Pspotless

  publish:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'release' }}
    needs: spotless
    uses: mekomsolutions/shared-github-workflow/.github/workflows/maven-publish.yml@main
    with:
      java-version: 17
      maven-args: -DskipTests
    secrets:
      NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
      NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}

  # One image per pipeline, all from the same Dockerfile and the same shaded JAR. The PIPELINE
  # build argument fixes which pipeline an image runs, so the choice is still made at build time.
  docker:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'release' }}
    needs: spotless
    strategy:
      fail-fast: false
      matrix:
        include:
          - pipeline: streaming
            image-name: ozone-flink-jobs
          - pipeline: batch
            image-name: ozone-flink-jobs-batch
          - pipeline: export
            image-name: ozone-flink-parquet-export
    uses: mekomsolutions/shared-github-workflow/.github/workflows/docker-build-publish.yml@main
    with:
      image-name: ${{ matrix.image-name }}
      build-args: PIPELINE=${{ matrix.pipeline }}
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
