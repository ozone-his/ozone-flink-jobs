# Logging for the Ozone Analytics ETL (Flink 2.x uses Log4j 2).
#
# This governs the client that submits the jobs and any standalone run of the jar. The Flink
# cluster (JobManager/TaskManager) logs through the Flink image's own conf/log4j-console.properties,
# which it selects explicitly with -Dlog4j.configurationFile, so this file does not affect it.

# Everything to the console at INFO.
rootLogger.level = INFO
rootLogger.appenderRef.console.ref = ConsoleAppender

appender.console.name = ConsoleAppender
appender.console.type = CONSOLE
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss,SSS} %-5p %-60c %x - %m%n

# The pipeline's own logs.
logger.ozone.name = com.ozonehis.analytics
logger.ozone.level = INFO

# Quiet third-party loggers that otherwise dump full configurations and connection handshakes at
# INFO on every startup -- Kafka's ConsumerConfig/ProducerConfig, ZooKeeper, Hadoop, and the like.
# WARN keeps their genuine warnings and errors while dropping the boilerplate.
logger.kafka.name = org.apache.kafka
logger.kafka.level = WARN
logger.flinkConfig.name = org.apache.flink.configuration.GlobalConfiguration
logger.flinkConfig.level = WARN
logger.zookeeper.name = org.apache.zookeeper
logger.zookeeper.level = WARN
logger.pekko.name = org.apache.pekko
logger.pekko.level = WARN
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = WARN
