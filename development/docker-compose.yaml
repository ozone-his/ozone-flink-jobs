services:
  # ---------------------------------------------------------------------------
  # Source and sink databases.
  #
  # These make the development stack self-contained. It previously assumed an externally running
  # Ozone HIS supplied them, which meant nothing here could be started on its own.
  #
  # The schemas under ./seed are generated from the Flink table definitions, so they carry exactly
  # the columns the pipelines read and cannot drift from them. See seed/generate-schemas.py.
  # ---------------------------------------------------------------------------

  # OpenMRS source. Debezium reads its binlog, which MariaDB does not enable by default:
  # without log-bin and ROW format the connector starts and then captures nothing.
  mariadb:
    image: mariadb:${MARIADB_VERSION}
    restart: on-failure
    command:
      - --log-bin=mariadb-bin
      - --binlog-format=ROW
      - --binlog-row-image=FULL
      - --server-id=${MARIADB_SERVER_ID}
      - --log-bin-trust-function-creators=1
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MARIADB_DATABASE: ${OPENMRS_DB_NAME}
      MARIADB_USER: ${OPENMRS_DB_USER}
      MARIADB_PASSWORD: ${OPENMRS_DB_PASSWORD}
    ports:
      # Off the default host port on purpose: 3306 and 5432 are routinely occupied by another
      # project's database, and binding them makes bringing this stack up either fail or, worse,
      # tempt someone into killing whatever holds the port.
      - "${MARIADB_HOST_PORT}:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./seed/mariadb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # Odoo source and the analytics sink, in one instance. `wal_level=logical` is what lets Debezium
  # create a replication slot; on the default (`replica`) the connector fails to start.
  postgresql:
    image: postgres:${POSTGRES_VERSION}
    restart: on-failure
    command:
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${CONNECT_ODOO_DB_NAME}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgresql-data:/var/lib/postgresql/data
      - ./seed/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${CONNECT_ODOO_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12

  zookeeper:
    restart: on-failure
    image: debezium/zookeeper:${DEBEZIUM_VERSION}
    ports:
      - 2181:2181
      - 2888:2888
      - 3888:3888
    volumes:
      - zookeeper-data:/zookeeper/data
      - zookeeper-txns:/zookeeper/txns
  zoonavigator:
    image: elkozmon/zoonavigator
    ports:
      - "8000:8000"
    environment:
      HTTP_PORT: 8000
      AUTO_CONNECT_CONNECTION_STRING: zookeeper:2181
  kafka:
    restart: on-failure
    image: debezium/kafka:${DEBEZIUM_VERSION}
    ports:
      - 9092:9092
      - 29092:29092
    environment:
      - CLUSTER_ID=5Yr1SIgYQz-b-dgRabWx4g
      - BROKER_ID=1
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      # - CREATE_TOPICS=${CREATE_TOPICS}
      - KAFKA_LISTENERS=PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:29092
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
    volumes:
      - kafka-data:/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "/bin/bash", "-c", "./bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list" ]
  kafka-setup:
    restart: on-failure
    image: debezium/kafka:${DEBEZIUM_VERSION}
    command:
      - /bin/bash
      - -c
      - |
        IFS=',' read -ra topics <<< "$$TOPICS"
        for topic in $${topics[@]}
          do
            echo "Creating topic $$topic..."
            ./bin/kafka-topics.sh --create --topic $$topic --partitions 1 --replication-factor 1 --if-not-exists --bootstrap-server kafka:9092
            ./bin/kafka-configs.sh --bootstrap-server=kafka:9092  --entity-type topics --entity-name $$topic --alter --add-config retention.ms=31556736000
        done
    environment:
      - TOPICS=${CREATE_TOPICS}
    depends_on:
      - kafka
  connect:
    restart: on-failure
    image: debezium/connect:${DEBEZIUM_VERSION}
    ports:
      - 8383:8083
    volumes:
      - ./debezium-connect/jars/TimestampConverter-1.2.4-SNAPSHOT.jar:/kafka/connect/debezium-connector-mysql/TimestampConverter-1.2.4-SNAPSHOT.jar
      - ./debezium-connect/jars/TimestampConverter-1.2.4-SNAPSHOT.jar:/kafka/connect/debezium-connector-postgres/TimestampConverter-1.2.4-SNAPSHOT.jar
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092
      - GROUP_ID=1
      - CONFIG_STORAGE_TOPIC=my_connect_configs
      - OFFSET_STORAGE_TOPIC=my_connect_offsets
      - STATUS_STORAGE_TOPIC=my_connect_statuses
      - CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE=false
      - CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE=false
      - CONNECT_CONFIG_PROVIDERS=file
      - CONNECT_CONFIG_PROVIDERS_FILE_CLASS=org.apache.kafka.common.config.provider.FileConfigProvider
      - CONNECT_MYSQL_HOSTNAME=${CONNECT_MYSQL_HOSTNAME:-mysql}
      - CONNECT_MYSQL_USERNAME=${CONNECT_MYSQL_USERNAME:-root}
      - CONNECT_MYSQL_PASSWORD=${CONNECT_MYSQL_PASSWORD:-${CONNECT_MYSQL_PASSWORD}}
      - CONNECT_MYSQL_PORT=${CONNECT_MYSQL_PORT:-${CONNECT_MYSQL_PORT}}
      - CONNECT_MYSQL_SERVER_ID=37991
      - CONNECT_MYSQL_SERVER_NAME=emr
      - CONNECT_MYSQL_INCLUDE_LIST=openmrs
      - CONNECT_TABLE_EXCLUDE_LIST=openmrs.audit_log
      - CONNECT_MYSQL_HISTROY_TOPIC=dbhistory.openmrs
      - CONNECT_MYSQL_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - CONNECT_ODOO_DB_HOSTNAME=${CONNECT_ODOO_DB_HOSTNAME:-postgresql}
      - CONNECT_ODOO_DB_USERNAME=${CONNECT_ODOO_DB_USERNAME:-${POSTGRES_USER}}
      - CONNECT_ODOO_DB_PASSWORD=${CONNECT_ODOO_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      - CONNECT_ODOO_DB_PORT=${CONNECT_ODOO_DB_PORT:-5432}
      - CONNECT_ODOO_DB_SERVER_NAME=odoo
      - CONNECT_ODOO_DB_INCLUDE_LIST=odoo

  connect-setup:
    restart: on-failure
    build: ./setup-connect
    depends_on:
      connect:
        condition: service_started
      mariadb:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    environment:
      - CONNECT_HOST=connect
      - SOURCE_DB_HOST=${CONNECT_MYSQL_HOSTNAME}
      - SOURCE_DB_PORT=${CONNECT_MYSQL_PORT}
      - ODOO_DB_HOST=${ODOO_DB_HOST:-${CONNECT_ODOO_DB_HOSTNAME}}
      - ODOO_DB_PORT=${ODOO_DB_PORT:-${CONNECT_ODOO_DB_PORT}}
      - FLINK_JOBMANAGER_HOST=jobmanager
  # ---------------------------------------------------------------------------
  # Flink cluster running the streaming pipeline in application mode.
  #
  # The image decides which pipeline it runs: the PIPELINE build argument becomes the baked-in
  # command. The JobManager runs that default command; the TaskManager runs the same image with the
  # command overridden. All runtime tuning comes from ./flink/config.yaml.
  #
  # For the batch and export pipelines, build the same Dockerfile with
  # --build-arg PIPELINE=batch-flatten or PIPELINE=file-export.
  # ---------------------------------------------------------------------------
  jobmanager: &flink
    image: ozone-flink-jobs
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PIPELINE: streaming-flatten
    restart: on-failure
    ports:
      - "8081:8081"   # Flink web UI
      - "9250:9250"   # Prometheus metrics
    volumes:
      - ./flink/config.yaml:/opt/flink/conf/config.yaml:ro
      - ./data/config.yaml:/etc/analytics/config.yaml:ro
      - ${ANALYTICS_SOURCE_TABLES_PATH}:/analytics/source-tables:ro
      - ${ANALYTICS_QUERIES_PATH}:/analytics/queries:ro
    environment: &flink-env
      # Resolved into /etc/analytics/config.yaml at startup. No credential is baked into an image.
      - ANALYTICS_DB_NAME=${ANALYTICS_DB_NAME}
      - ANALYTICS_DB_USER=${ANALYTICS_DB_USER}
      - ANALYTICS_DB_PASSWORD=${ANALYTICS_DB_PASSWORD}
      - ANALYTICS_DB_HOST=${ANALYTICS_DB_HOST}
      - ANALYTICS_DB_PORT=${ANALYTICS_DB_PORT}
      - ANALYTICS_KAFKA_URL=kafka:9092
      - OPENMRS_DB_NAME=${OPENMRS_DB_NAME}
      - OPENMRS_DB_USER=${OPENMRS_DB_USER}
      - OPENMRS_DB_PASSWORD=${OPENMRS_DB_PASSWORD}
      - OPENMRS_DB_HOST=${OPENMRS_DB_HOST}
      - OPENMRS_DB_PORT=${OPENMRS_DB_PORT}
      - ODOO_DB_NAME=${CONNECT_ODOO_DB_NAME}
      - ODOO_DB_USER=${CONNECT_ODOO_DB_USER}
      - ODOO_DB_PASSWORD=${CONNECT_ODOO_DB_PASSWORD}
      - ODOO_DB_HOST=${CONNECT_ODOO_DB_HOSTNAME}
      - ODOO_DB_PORT=${CONNECT_ODOO_DB_PORT}
      # Credentials for the S3 (MinIO) checkpoint and savepoint store.
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    depends_on:
      createbuckets:
        condition: service_completed_successfully
      analytics-migration:
        condition: service_completed_successfully
      kafka-setup:
        condition: service_completed_successfully

  taskmanager:
    <<: *flink
    command: taskmanager
    ports: []
    environment: *flink-env
    depends_on:
      - jobmanager
    deploy:
      replicas: 1

  kowl:
    image: rsmnarts/kowl
    container_name: "kowl"
    restart: on-failure
    entrypoint: /bin/sh
    command: -c "echo \"$$KOWL_CONFIG_FILE\" > /tmp/config.yml; /app/kowl"
    ports:
      - "8282:8080"
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      KOWL_CONFIG_FILE: |
        kafka:
          brokers: ["kafka:9092"]
        connect:
          enabled: true
          clusters:
            - name: Ozone
              url: http://connect:8083
    depends_on:
      - "kafka"
      - "connect"
  odoo-replica-identity-migration:
    image: liquibase/liquibase:4.24
    restart: on-failure
    volumes:
      - ./liquibase/odoo/:/liquibase/changelog/
    command: update -Dtables='databasechangelog,account_account' --username=${CONNECT_ODOO_DB_USER} --password=${CONNECT_ODOO_DB_PASSWORD} --changeLogFile=${CHANGELOG_FILE} --url=jdbc:postgresql://${CONNECT_ODOO_DB_HOSTNAME}:${CONNECT_ODOO_DB_PORT}/${CONNECT_ODOO_DB_NAME}
    environment:
      - INSTALL_POSTGRESQL='true'
      - TABLES=${ODOO_ANALYTICS_TABLES}
  # Creates the flattened destination tables the pipelines write into. Must complete before any
  # job starts: Flink resolves the sink tables through the catalog at submission time and fails
  # outright if they are missing.
  analytics-migration:
    image: liquibase/liquibase:4.24
    restart: on-failure
    depends_on:
      postgresql:
        condition: service_healthy
    volumes:
      - ${ANALYTICS_DESTINATION_TABLES_MIGRATIONS_PATH:-analytics-migrations}:/liquibase/changelog/
    command: update --username=${ANALYTICS_DB_USER} --password=${ANALYTICS_DB_PASSWORD} --changeLogFile=${CHANGELOG_FILE} --url=jdbc:postgresql://${ANALYTICS_DB_HOST}:${ANALYTICS_DB_PORT}/${ANALYTICS_DB_NAME}
    environment:
      - INSTALL_POSTGRESQL='true'
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9099:9099"
    volumes:
      - storage-minio:/data
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}
    command: server --address ":9099" --console-address ":9000" /data
    healthcheck:
      test: timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1
      start_period: 5s
      interval: 10s
      timeout: 5s
      retries: 2

  # Creates the bucket Flink checkpoints into. `mc config host add` was removed from newer mc
  # releases in favour of `mc alias set`; combined with the trailing `exit 0` the failure was
  # silent, and the only symptom was Flink failing every checkpoint with NoSuchBucket while the job
  # still reported RUNNING (tolerable-failed-checkpoints hides it). Fail loudly instead.
  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -ec "
      /usr/bin/mc alias set myminio http://minio:9099 '${AWS_ACCESS_KEY_ID}' '${AWS_SECRET_ACCESS_KEY}';
      /usr/bin/mc mb --ignore-existing myminio/${FLINK_STATE_BUCKET};
      "

volumes:
  mariadb-data: ~
  postgresql-data: ~
  kafka-data: ~
  zookeeper-data: ~
  zookeeper-txns: ~
  storage-minio: ~
