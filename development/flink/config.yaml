# Flink cluster configuration (Flink 2.x `config.yaml` format, which replaced `flink-conf.yaml`).
#
# This owns HOW the pipeline runs. What it computes is defined separately in the pipeline
# configuration -- see development/data/config.yaml.
#
# These settings used to be assembled in Java to configure an embedded MiniCluster, which meant a
# tuning change required a rebuild. They belong to the cluster, so they live here and are shared by
# the JobManager and every TaskManager.
#
# This is the local development baseline: sized to run on a laptop. Production overrides live in
# the ozone-analytics distro.

# JVM flags Flink requires on Java 17+ to reach JDK internals the module system closed off.
# Without them the job fails at startup with InaccessibleObjectException.
#
# This file is mounted over the image's own conf/config.yaml, which replaces the defaults rather
# than merging with them -- so this list has to be reproduced here. It is copied verbatim from
# flink:2.0.2-java17. Per the Flink docs the list "must not be shortened, but only extended", so
# add to it rather than pruning it, and re-copy it from the image when upgrading Flink.
env:
  java:
    opts:
      all: --add-exports=java.base/sun.net.util=ALL-UNNAMED --add-exports=java.rmi/sun.rmi.registry=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.api=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.parser=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-exports=java.security.jgss/sun.security.krb5=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.net=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/java.lang.reflect=ALL-UNNAMED --add-opens=java.base/java.text=ALL-UNNAMED --add-opens=java.base/java.time=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/java.util.concurrent=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED --add-opens=java.base/java.util.concurrent.locks=ALL-UNNAMED

jobmanager:
  rpc:
    address: jobmanager
    port: 6123
  memory:
    process:
      size: 1600m

taskmanager:
  numberOfTaskSlots: 8
  memory:
    process:
      size: 4g
    managed:
      fraction: 0.7

parallelism:
  default: 2

# Exactly-once checkpointing to S3 (MinIO). Unaligned checkpoints keep barriers moving when a sink
# backpressures, which matters here because every flattening sink shares a single job.
execution:
  checkpointing:
    mode: EXACTLY_ONCE
    interval: 10min
    timeout: 10min
    unaligned:
      enabled: true
    tolerable-failed-checkpoints: 50

state:
  backend:
    type: rocksdb
    incremental: true
  checkpoints:
    dir: s3://flink-state-bucket/checkpoints/
    num-retained: 2
  savepoints:
    dir: s3://flink-state-bucket/savepoints/

restart-strategy:
  type: exponential-delay

table:
  exec:
    # Batch writes to PostgreSQL rather than issuing one statement per row.
    mini-batch:
      enabled: true
      allow-latency: 5s
      size: 5000
    # Without a TTL a streaming join retains state forever; this is the usual cause of unbounded
    # state growth in a long-running Flink SQL job.
    state:
      ttl: 1h

# Presto S3 access to MinIO. Credentials are not written here: AWS_ACCESS_KEY_ID and
# AWS_SECRET_ACCESS_KEY from the environment are picked up by the standard AWS credential chain.
# Path-style access is required because MinIO does not serve virtual-host style buckets.
s3:
  endpoint: http://minio:9099
  path:
    style:
      access: true

metrics:
  reporters: prom
  reporter:
    prom:
      factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
      port: 9250

rest:
  address: 0.0.0.0
  bind-address: 0.0.0.0
